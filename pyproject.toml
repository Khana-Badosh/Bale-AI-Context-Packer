[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bale"
version = "0.1.0"
description = "Pack a project folder into an AI-ready prompt: tree, bundle and flatten, with .gitignore support and secret protection."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["llm", "ai", "prompt", "context", "cli", "tree", "gitignore"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = ["pathspec>=0.11"]

[project.urls]
Homepage = "https://github.com/Khana-Badosh/Bale-AI-Context-Packer"
Issues = "https://github.com/Khana-Badosh/Bale-AI-Context-Packer/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bale = "bale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
